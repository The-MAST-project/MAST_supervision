# Continuous integration for MAST_supervision.
#
# The programs run only on Windows (unit and spec machines), but the design keeps every
# phase a pure function of injected probes, so most of the suite is platform-neutral and
# the win32 side is tested against fakes. Matrixed over both: Linux proves nothing
# imports win32 or tkinter at module scope, Windows proves the real bindings load.
#
# Layout reproduces a MAST machine's <top>, as MAST_unit's workflow does -- two sibling
# checkouts with the workspace root standing in for mast.pth:
#
#   <workspace>/
#     common/        <- MAST_common: the branch named like this one's head, else its base, else master
#     supervision/   <- this repo; the repo root IS the `supervision` package
#
# Dependencies are installed in ONE uv resolve over MAST_common's CI pins and this
# repo's pyproject.toml, the same joint resolve mast-clone performs on the fleet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out MAST_supervision
        uses: actions/checkout@v7
        with:
          path: supervision

      # The head branch's namesake first, then the base branch's -- so a PR into an
      # integration branch builds against common's branch of that name even when its own
      # head has no counterpart there -- then master.
      - name: Resolve the paired MAST_common branch
        id: common-ref
        shell: bash
        env:
          HEAD: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
        run: |
          remote=https://github.com/The-MAST-project/MAST_common.git
          for candidate in "$HEAD" "$BASE"; do
            if [ -n "$candidate" ] && [ -n "$(git ls-remote --heads "$remote" "$candidate")" ]; then
              echo "ref=$candidate" >> "$GITHUB_OUTPUT"
              echo "MAST_common: building against the paired branch '$candidate'"
              exit 0
            fi
          done
          echo "ref=master" >> "$GITHUB_OUTPUT"
          echo "MAST_common: no branch named '$HEAD' or '$BASE'; building against master"

      - name: Check out MAST_common as a sibling
        uses: actions/checkout@v7
        with:
          repository: The-MAST-project/MAST_common
          ref: ${{ steps.common-ref.outputs.ref }}
          path: common

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          # The fleet's uv, from MAST_provisioning's mast-repos.tsv `#!uv-version`.
          version: "0.11.33"

      - name: Install dependencies
        shell: bash
        run: bash supervision/tools/dev-env.sh --system

      - name: Tests
        working-directory: supervision
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -ra

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"

      - name: Format
        run: uv run --only-group dev ruff format --check .

      - name: Lint
        run: uv run --only-group dev ruff check .
